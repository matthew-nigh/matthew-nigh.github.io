name: Update publications

on:
  schedule:
    # Every Monday at 13:00 UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch:

# contents: write lets this workflow commit publications.json.
# pages: write and id-token: write deploy the site in this same workflow.
# A GITHUB_TOKEN push does not start the separate "Deploy to GitHub Pages"
# workflow, so the deploy job below publishes the updated catalog.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test publication merge
        run: npm test

      - name: Update publications
        run: npm run publications:update

      - name: Format the catalog
        run: npx prettier --write src/data/publications.json

      - name: Commit catalog if it changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update publications from DBLP and Semantic Scholar"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build
        env:
          CI: ''

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.update.outputs.changed == 'true'
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
